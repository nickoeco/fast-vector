name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DFAST_VECTOR_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Test validation utilities
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate against NumPy ground truth
        run: |
          python scripts/validate_recall.py \
            --runner build/fast_vector_validate \
            --output-dir build/validation-output \
            --vector-count 500 \
            --query-count 20 \
            --dimension 32 \
            --k 10

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ThreadSanitizer
        run: |
          cmake -S . -B build-tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFAST_VECTOR_ENABLE_THREAD_SANITIZER=ON \
            -DFAST_VECTOR_BUILD_BENCHMARKS=OFF \
            -DFAST_VECTOR_BUILD_VALIDATION=OFF
      - name: Build
        run: cmake --build build-tsan --parallel
      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure

  portable-no-avx2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure without AVX2
        run: |
          cmake -S . -B build-noavx \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFAST_VECTOR_ENABLE_AVX2=OFF \
            -DFAST_VECTOR_BUILD_BENCHMARKS=OFF \
            -DFAST_VECTOR_BUILD_VALIDATION=OFF
      - name: Build
        run: cmake --build build-noavx --parallel
      - name: Test
        run: ctest --test-dir build-noavx --output-on-failure

  grpc-integration:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install gRPC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            protobuf-compiler protobuf-compiler-grpc libprotobuf-dev libgrpc++-dev
      - name: Configure
        run: |
          cmake -S . -B build-grpc \
            -DCMAKE_BUILD_TYPE=Debug \
            -DFAST_VECTOR_BUILD_GRPC=ON \
            -DFAST_VECTOR_BUILD_BENCHMARKS=OFF \
            -DFAST_VECTOR_BUILD_VALIDATION=OFF
      - name: Build
        run: cmake --build build-grpc --parallel
      - name: Test
        run: ctest --test-dir build-grpc --output-on-failure
      - name: Install Python gRPC dependencies
        run: python -m pip install -r scripts/requirements-grpc.txt
      - name: Test Python gRPC client
        env:
          FAST_VECTOR_SERVER: build-grpc/fast_vector_server
        run: python -m unittest -v tests/grpc_python_test.py
