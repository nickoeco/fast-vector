syntax = "proto3";

package fast_vector.v1;

message Vector {
  uint64 id = 1;
  repeated float values = 2;
}

message AddVectorRequest {
  Vector vector = 1;
}

message AddVectorResponse {
  uint64 index_size = 1;
}

message BatchAddRequest {
  repeated Vector vectors = 1;
}

message BatchAddResponse {
  uint64 added_count = 1;
  uint64 index_size = 2;
}

message SearchRequest {
  repeated float query = 1;
  uint32 k = 2;
}

message Neighbor {
  uint64 id = 1;
  float score = 2;
}

message SearchResponse {
  repeated Neighbor neighbors = 1;
  uint64 snapshot_version = 2;
  uint64 queue_us = 3;
  uint64 execution_us = 4;
}

message SearchExecutorStats {
  uint64 workers = 1;
  uint64 queue_capacity = 2;
  uint64 queued = 3;
  uint64 running = 4;
  uint64 peak_queued = 5;
  uint64 peak_running = 6;
  uint64 admitted = 7;
  uint64 rejected = 8;
  uint64 started = 9;
  uint64 completed = 10;
  uint64 succeeded = 11;
  uint64 failed = 12;
  uint64 cancelled = 13;
  uint64 expired = 14;
  uint64 queue_us_total = 15;
  uint64 execution_us_total = 16;
}

message GetStatsRequest {}

message GetStatsResponse {
  string index_type = 1;
  uint64 vector_count = 2;
  uint64 dimension = 3;
  uint64 successful_queries = 4;
  uint64 failed_queries = 5;
  uint64 inserted_vectors = 6;
  bool read_only = 7;
  SearchExecutorStats search_executor = 8;
  uint64 snapshot_version = 9;
}

service VectorSearchService {
  rpc AddVector(AddVectorRequest) returns (AddVectorResponse);
  rpc BatchAdd(BatchAddRequest) returns (BatchAddResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
}
