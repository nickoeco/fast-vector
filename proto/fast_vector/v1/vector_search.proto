syntax = "proto3";

package fast_vector.v1;

message Vector {
  uint64 id = 1;
  repeated float values = 2;
}

message AddVectorRequest {
  Vector vector = 1;
  string client_operation_id = 2;
}

message AddVectorResponse {
  uint64 index_size = 1;
  uint64 lsn = 2;
  bool replayed = 3;
}

message CheckpointRequest {}
message CheckpointResponse { uint64 lsn = 1; }

message DurabilityStats {
  bool enabled = 1;
  bool recovery_required = 2;
  uint64 applied_lsn = 3;
  uint64 checkpoint_lsn = 4;
  uint64 recovered_records = 5;
  uint64 discarded_tail_bytes = 6;
  uint64 recovery_us = 7;
  uint64 last_sync_us = 8;
  uint64 last_write_us = 9;
  uint64 last_checkpoint_us = 10;
}

message BatchAddRequest {
  repeated Vector vectors = 1;
}

message BatchAddResponse {
  uint64 added_count = 1;
  uint64 index_size = 2;
}

message SearchRequest {
  repeated float query = 1;
  uint32 k = 2;
  string expected_snapshot_id = 3;
}

message Neighbor {
  uint64 id = 1;
  float score = 2;
}

message SearchResponse {
  repeated Neighbor neighbors = 1;
  uint64 snapshot_version = 2;
  uint64 queue_us = 3;
  uint64 execution_us = 4;
  string snapshot_id = 5;
  uint64 generation = 6;
  string embedding_revision = 7;
}

message SnapshotManifest {
  uint32 format_version = 1;
  string snapshot_id = 2;
  string index_type = 3;
  uint64 dimension = 4;
  uint64 vector_count = 5;
  uint64 file_size = 6;
  string sha256 = 7;
  string embedding_revision = 8;
}

message SnapshotIdentity {
  string snapshot_id = 1;
  uint64 generation = 2;
  string embedding_revision = 3;
}

message PublicationStatus {
  string state = 1;
  SnapshotIdentity current = 2;
  SnapshotIdentity candidate = 3;
  uint64 highest_generation = 4;
  string last_result = 5;
  SnapshotIdentity last_attempt = 6;
  uint64 prepare_us = 7;
  uint64 activation_us = 8;
  uint64 peak_rss_kib = 9;
  bool enabled = 10;
}

message PrepareSnapshotRequest {
  // The first frame contains manifest/generation only; later frames contain data only.
  SnapshotManifest manifest = 1;
  uint64 generation = 2;
  bytes data = 3;
  bool abort = 4;
}

message ActivateSnapshotRequest {
  string snapshot_id = 1;
  uint64 generation = 2;
}

message SearchExecutorStats {
  uint64 workers = 1;
  uint64 queue_capacity = 2;
  uint64 queued = 3;
  uint64 running = 4;
  uint64 peak_queued = 5;
  uint64 peak_running = 6;
  uint64 admitted = 7;
  uint64 rejected = 8;
  uint64 started = 9;
  uint64 completed = 10;
  uint64 succeeded = 11;
  uint64 failed = 12;
  uint64 cancelled = 13;
  uint64 expired = 14;
  uint64 queue_us_total = 15;
  uint64 execution_us_total = 16;
  uint64 queued_bytes = 17;
  uint64 peak_queued_bytes = 18;
  uint64 queue_byte_limit = 19;
}

message GetStatsRequest {}

message GetStatsResponse {
  string index_type = 1;
  uint64 vector_count = 2;
  uint64 dimension = 3;
  uint64 successful_queries = 4;
  uint64 failed_queries = 5;
  uint64 inserted_vectors = 6;
  bool read_only = 7;
  SearchExecutorStats search_executor = 8;
  uint64 snapshot_version = 9;
  PublicationStatus publication = 10;
  DurabilityStats durability = 11;
  uint64 snapshot_accounted_bytes = 12;
  uint64 snapshot_budget_bytes = 13;
  uint64 maximum_top_k = 14;
  uint64 maximum_index_vectors = 15;
}

service VectorSearchService {
  rpc AddVector(AddVectorRequest) returns (AddVectorResponse);
  rpc BatchAdd(BatchAddRequest) returns (BatchAddResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
  rpc PrepareSnapshot(stream PrepareSnapshotRequest) returns (PublicationStatus);
  rpc ActivateSnapshot(ActivateSnapshotRequest) returns (PublicationStatus);
  rpc Checkpoint(CheckpointRequest) returns (CheckpointResponse);
}
